services:
  - type: web
    name: toxico
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PUBLICAI_API_KEY
        sync: false
      - key: PUBLICAI_MODEL
        value: swiss-ai/apertus-8b-instruct
